<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🧱 MC玩家社区</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0ece6;
            min-height: 100vh;
            padding: 16px;
            color: #2c2721;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 1000px; width: 100%; }

        .header {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 10px;
            border-bottom: 2px solid #d5cdc0;
        }
        .logo { font-size: 22px; font-weight: 700; }
        .user-area { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        /* ===== 登录按钮 ===== */
        .btn {
            padding: 8px 20px; border-radius: 30px; border: none;
            font-weight: 600; font-size: 14px; cursor: pointer;
            transition: 0.2s;
        }
        .btn-login {
            background: #2b6b4a;
            color: #fff;
            padding: 10px 28px;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(43, 107, 74, 0.3);
        }
        .btn-login:hover {
            background: #1f5238;
            transform: translateY(-1px);
        }
        .btn-login i { margin-right: 6px; }

        .btn-primary { background: #3d372e; color: #f5efe6; }
        .btn-primary:hover { background: #2d2821; }
        .btn-secondary { background: #e3dbce; color: #3b3329; }
        .btn-secondary:hover { background: #d2c8b8; }
        .btn-danger { background: #b33c3c; color: #fff; }
        .btn-danger:hover { background: #8f2e2e; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .user-badge {
            display: flex; align-items: center; gap: 8px;
            background: #e8e0d4; padding: 4px 14px 4px 10px;
            border-radius: 30px;
        }
        .user-badge .name { font-weight: 600; font-size: 14px; }
        .logout-btn { background: none; border: none; color: #6b5f4f; cursor: pointer; font-size: 14px; }

        /* ===== 登录提示条 ===== */
        .login-banner {
            text-align: center;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: #fff3cd;
            border-radius: 16px;
            border: 2px dashed #f5a623;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .login-banner .hint {
            font-size: 15px;
            font-weight: 600;
            color: #856404;
        }
        .login-banner .btn-login {
            padding: 8px 24px;
            font-size: 14px;
        }

        .card {
            background: #fefcf8; border-radius: 20px; padding: 18px;
            border: 1px solid #e8e1d6; margin-bottom: 18px;
        }
        .card h2 { font-size: 17px; margin-bottom: 14px; }
        .card h3 { font-size: 15px; margin-bottom: 10px; }

        .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .row .field { flex: 1; min-width: 130px; }
        .row .field label { display: block; font-size: 12px; font-weight: 600; color: #5a4f42; margin-bottom: 3px; }
        .row .field input, .row .field select, .row .field textarea {
            width: 100%; padding: 8px 14px; border-radius: 24px;
            border: 1.5px solid #e0d8cc; background: #faf8f4;
            font-size: 14px; outline: none; font-family: inherit;
        }
        .row .field textarea { min-height: 50px; resize: vertical; }

        .file-btn {
            display: inline-block; padding: 6px 14px; border-radius: 30px;
            background: #eae3d7; border: 1px solid #d6ccbb;
            cursor: pointer; font-size: 13px; font-weight: 500;
        }
        .file-btn:hover { background: #ddd4c5; }
        .file-preview { max-width: 80px; max-height: 70px; border-radius: 10px; margin-top: 4px; display: none; }
        .file-name { font-size: 12px; color: #7c7161; margin-top: 3px; }

        .pills { display: flex; flex-wrap: wrap; gap: 5px 8px; margin-bottom: 14px; }
        .pill {
            padding: 4px 14px; border-radius: 30px; font-size: 13px; font-weight: 500;
            background: #e8e1d6; border: 1px solid #d5ccbe; cursor: pointer;
            transition: 0.15s;
        }
        .pill.active { background: #3d372e; color: #f5efe6; border-color: #3d372e; }
        .pill:hover { background: #d5ccbd; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
        .post {
            background: #f8f4ee; border-radius: 18px; padding: 14px;
            border: 1px solid #e6ded2;
            transition: 0.15s;
        }
        .post:hover { border-color: #cbc0b0; }
        .post .tag { font-size: 11px; font-weight: 600; background: #d8cfc0; padding: 2px 10px; border-radius: 20px; display: inline-block; }
        .post .ver { font-size: 10px; background: #cbc0b0; padding: 1px 8px; border-radius: 20px; margin-left: 4px; }
        .post h4 { font-size: 15px; margin: 6px 0 4px; word-break: break-word; }
        .post .desc { font-size: 13px; color: #4d4338; margin: 4px 0 6px; word-break: break-word; }
        .post .img { max-width: 100%; border-radius: 12px; max-height: 100px; object-fit: cover; margin: 4px 0; }
        .post .link { display: inline-block; background: #2b261f; color: #f0ebe2; padding: 2px 12px; border-radius: 30px; font-size: 11px; text-decoration: none; margin: 3px 0; }
        .post .download { display: inline-block; background: #4a7a5c; color: white; padding: 2px 12px; border-radius: 30px; font-size: 11px; text-decoration: none; margin: 3px 0; }
        .post .author { font-size: 12px; color: #7c7161; margin-top: 4px; }

        .comments { margin-top: 10px; border-top: 1px solid #e0d7c8; padding-top: 8px; }
        .comments .input-area { display: flex; gap: 6px; flex-wrap: wrap; }
        .comments .input-area input { flex: 1; padding: 4px 12px; border-radius: 30px; border: 1.5px solid #e0d8cc; font-size: 13px; outline: none; min-width: 70px; }
        .comments .input-area button { background: #3d372e; color: white; border: none; padding: 4px 14px; border-radius: 30px; font-weight: 600; font-size: 12px; cursor: pointer; }
        .comment-item { font-size: 12px; padding: 3px 0; border-bottom: 1px dashed #e5ddd0; }
        .comment-item .cname { font-weight: 600; }

        .empty { text-align: center; padding: 30px 16px; color: #6e6354; }
        .empty i { font-size: 36px; opacity: 0.2; margin-bottom: 8px; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center;
            z-index: 999; padding: 16px;
        }
        .modal-box {
            background: #fefcf8; max-width: 400px; width: 100%;
            padding: 32px 28px; border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box h2 { font-size: 22px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        .modal-box .subtitle { font-size: 14px; color: #857b6d; margin-bottom: 20px; }
        .modal-box .field { margin-bottom: 14px; }
        .modal-box .field label { display: block; font-size: 13px; font-weight: 600; color: #4a4035; margin-bottom: 4px; }
        .modal-box .field input {
            width: 100%; padding: 12px 16px; border-radius: 30px;
            border: 1.5px solid #e0d8cc; font-size: 15px; outline: none;
            transition: 0.2s;
        }
        .modal-box .field input:focus {
            border-color: #3d372e;
            box-shadow: 0 0 0 3px rgba(61, 55, 46, 0.15);
        }
        .modal-box .actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-box .actions button { flex: 1; padding: 12px; border-radius: 30px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .modal-box .actions .btn-primary { background: #3d372e; color: #f5efe6; }
        .modal-box .actions .btn-primary:hover { background: #2d2821; }
        .modal-box .actions .btn-secondary { background: #e3dbce; color: #3b3329; }
        .modal-box .actions .btn-secondary:hover { background: #d2c8b8; }
        .modal-box .switch { text-align: center; margin-top: 14px; font-size: 14px; color: #5f5445; }
        .modal-box .switch span { color: #2b6b4a; font-weight: 600; cursor: pointer; text-decoration: underline; }
        .modal-box .switch span:hover { color: #1f5238; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #2c2721; color: #f5efe6; padding: 12px 28px; border-radius: 30px;
            font-size: 14px; font-weight: 500; z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: none; max-width: 90%; text-align: center;
        }
        .toast.show { display: block; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .loading-tip { font-size: 13px; color: #8f8476; display: none; }

        @media (max-width: 640px) {
            .row .field { flex: 1 1 100%; }
            .grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .modal-box { padding: 24px 18px; }
            .login-banner { flex-direction: column; gap: 8px; }
            .login-banner .btn-login { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== 头部 ===== -->
    <header class="header">
        <div class="logo">🧱 MC玩家社区</div>
        <div class="user-area" id="headerRight"></div>
    </header>

    <!-- ===== 🔐 登录提示条（强制显示） ===== -->
    <div class="login-banner" id="loginBanner">
        <span class="hint"><i class="fas fa-exclamation-circle"></i> 请先登录才能发布和评论</span>
        <button class="btn btn-login" id="loginOpenBtn">
            <i class="fas fa-sign-in-alt"></i> 登录 / 注册
        </button>
    </div>

    <!-- ===== 发布卡片 ===== -->
    <div class="card">
        <h2>📝 发布资源</h2>
        <div class="row">
            <div class="field">
                <label>分类</label>
                <select id="categorySelect">
                    <option value="投影">📐 投影</option>
                    <option value="指令">⚡ 指令</option>
                    <option value="建筑">🏛️ 建筑</option>
                    <option value="机制">⚙️ 机制</option>
                    <option value="光影">☀️ 光影</option>
                    <option value="其他">📁 其他</option>
                </select>
            </div>
            <div class="field">
                <label>版本</label>
                <select id="versionSelect">
                    <option value="全版本">全版本</option>
                    <option value="1.21+">1.21+</option>
                    <option value="1.21.4">1.21.4</option>
                    <option value="1.21.3">1.21.3</option>
                    <option value="1.21.2">1.21.2</option>
                    <option value="1.21.1">1.21.1</option>
                    <option value="1.21">1.21</option>
                    <option value="1.20.6">1.20.6</option>
                    <option value="1.20.5">1.20.5</option>
                    <option value="1.20.4">1.20.4</option>
                    <option value="1.20.3">1.20.3</option>
                    <option value="1.20.2">1.20.2</option>
                    <option value="1.20.1">1.20.1</option>
                    <option value="1.20">1.20</option>
                    <option value="1.19.4">1.19.4</option>
                    <option value="1.19.3">1.19.3</option>
                    <option value="1.19.2">1.19.2</option>
                    <option value="1.19.1">1.19.1</option>
                    <option value="1.19">1.19</option>
                    <option value="1.18.2">1.18.2</option>
                    <option value="1.18.1">1.18.1</option>
                    <option value="1.18">1.18</option>
                    <option value="1.17.1">1.17.1</option>
                    <option value="1.17">1.17</option>
                    <option value="1.16.5">1.16.5</option>
                </select>
            </div>
            <div class="field">
                <label>标题 *</label>
                <input type="text" id="titleInput" placeholder="资源名称">
            </div>
        </div>
        <div class="row">
            <div class="field" style="flex:2;">
                <label>描述</label>
                <textarea id="descInput" placeholder="简单介绍……"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="field">
                <label>📷 截图</label>
                <span class="file-btn" id="imageUploadBtn">选择图片</span>
                <input type="file" id="imageInput" accept="image/*" style="display:none;">
                <img id="imagePreview" class="file-preview">
            </div>
            <div class="field">
                <label>🔗 网址</label>
                <input type="url" id="urlInput" placeholder="https://example.com">
            </div>
        </div>
        <div class="row">
            <div class="field">
                <label>📦 上传文件（供下载）</label>
                <span class="file-btn" id="fileUploadBtn">选择文件</span>
                <input type="file" id="fileInput" style="display:none;">
                <div class="file-name" id="fileNameDisplay">未选择文件</div>
            </div>
        </div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:4px;">
            <button class="btn btn-primary" id="publishBtn"><i class="fas fa-cloud-upload-alt"></i> 发布</button>
            <span style="font-size:13px;color:#857b6d;" id="publishHint">登录后发布</span>
            <span class="loading-tip" id="loadingTip">⏳ 发布中...</span>
        </div>
    </div>

    <!-- ===== 分类 ===== -->
    <div class="pills" id="categoryPills">
        <span class="pill active" data-cat="全部">全部</span>
        <span class="pill" data-cat="投影">投影</span>
        <span class="pill" data-cat="指令">指令</span>
        <span class="pill" data-cat="建筑">建筑</span>
        <span class="pill" data-cat="机制">机制</span>
        <span class="pill" data-cat="光影">光影</span>
        <span class="pill" data-cat="其他">其他</span>
    </div>

    <!-- ===== 帖子列表 ===== -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3>📋 最新分享</h3>
            <span style="font-size:13px; color:#8f8476;" id="categoryHint">全部</span>
        </div>
        <div id="emptyState" class="empty">
            <i class="fas fa-cube"></i>
            <p><strong>暂无玩家上传</strong><br>登录后分享你的创造</p>
        </div>
        <div id="uploadList" class="grid" style="display:none;"></div>
    </div>

    <div style="text-align:center; color:#8f8476; font-size:12px; border-top:1px solid #e1d8cb; padding-top:14px; margin-top:10px;">
        数据存储在 Supabase 云端 · 所有玩家数据互通
    </div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== Modal ===== -->
<div class="modal" id="authModal">
    <div class="modal-box">
        <h2 id="modalTitle">🔑 欢迎回来</h2>
        <div class="subtitle" id="modalSubtitle">登录你的账号，分享MC创作</div>
        <div class="field">
            <label>👤 玩家名称</label>
            <input type="text" id="authUsername" placeholder="输入你的名称">
        </div>
        <div class="field">
            <label>🔒 密码</label>
            <input type="password" id="authPassword" placeholder="输入密码">
        </div>
        <div class="actions">
            <button id="authPrimaryBtn" class="btn btn-primary">登录</button>
            <button id="authSecondaryBtn" class="btn btn-secondary">注册</button>
        </div>
        <div class="switch" id="switchAction">
            <span id="switchText">还没有账号？ 立即注册</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>
<script>
    // ================================================================
    //  ⚙️ Supabase 配置
    // ================================================================
    const SUPABASE_URL = 'https://rnrpieakjz.poxwxrj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJucnBpZWFramZleHFwb3h3eHJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTEwOTksImV4cCI6MjEwNDE2NzA5OX0.WcosU_A74G8kVT4wIafVVIj05f4V-LEvMmZIhPApX08';
    // ================================================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ---------- 工具 ----------
    const $ = id => document.getElementById(id);
    const showToast = (msg, duration = 3000) => {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), duration);
    };

    let currentUser = null;
    let allPosts = [];
    let currentCategory = '全部';

    // ---------- 用户认证 ----------
    async function registerUser(username, password) {
        const { data, error } = await supabase.from('users').insert([{ username, password }]).select();
        if (error) throw new Error(error.message);
        return data;
    }

    async function loginUser(username, password) {
        const { data, error } = await supabase.from('users').select('*').eq('username', username).eq('password', password);
        if (error) throw new Error(error.message);
        if (data.length === 0) throw new Error('用户名或密码错误');
        return data[0];
    }

    // ---------- 帖子操作 ----------
    async function loadPosts() {
        try {
            const { data, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
            if (error) throw new Error(error.message);
            allPosts = data || [];
            renderPosts();
        } catch (e) {
            showToast('加载失败: ' + e.message, 4000);
            console.error(e);
        }
    }

    async function publishPost(category, version, title, desc, url, image, fileData, fileName) {
        const newPost = {
            category, version, title,
            description: desc || '',
            url: url || '',
            image_url: image || '',
            file_data: fileData || '',
            file_name: fileName || '',
            author: currentUser ? currentUser.username : '匿名'
        };
        const { data, error } = await supabase.from('posts').insert([newPost]).select();
        if (error) throw new Error(error.message);
        return data[0];
    }

    async function addComment(postId, userName, content) {
        const { error } = await supabase.from('comments').insert([{ post_id: postId, user_name: userName, content }]);
        if (error) throw new Error(error.message);
        return true;
    }

    // ---------- 渲染 ----------
    function renderPosts() {
        const filtered = currentCategory === '全部' ? allPosts : allPosts.filter(p => p.category === currentCategory);
        const list = $('uploadList');
        const empty = $('emptyState');
        list.innerHTML = '';
        if (filtered.length === 0) {
            empty.style.display = 'block';
            list.style.display = 'none';
            empty.innerHTML = currentCategory === '全部' ?
                `<i class="fas fa-cube"></i><p><strong>暂无玩家上传</strong><br>登录后分享你的创造</p>` :
                `<i class="fas fa-search"></i><p><strong>没有"${currentCategory}"分类的内容</strong></p>`;
            return;
        }
        empty.style.display = 'none';
        list.style.display = 'grid';
        filtered.forEach(post => {
            const div = document.createElement('div');
            div.className = 'post';
            div.innerHTML = `
                <span class="tag">${post.category}</span>
                <span class="ver">${post.version}</span>
                <h4>${post.title}</h4>
                ${post.description ? `<div class="desc">${post.description}</div>` : ''}
                ${post.image_url ? `<img class="img" src="${post.image_url}" onerror="this.style.display='none'">` : ''}
                ${post.url ? `<a class="link" href="${post.url}" target="_blank">🔗 访问网址</a>` : ''}
                ${post.file_data && post.file_name ? `<a class="download" href="${post.file_data}" download="${post.file_name}">⬇ 下载 ${post.file_name}</a>` : ''}
                <div class="author">👤 ${post.author}</div>
                <div class="comments" id="comments_${post.id}">
                    <div class="input-area">
                        <input type="text" placeholder="写评论..." id="cmt_${post.id}">
                        <button onclick="handleComment('${post.id}')">发送</button>
                    </div>
                    <div id="cmt_list_${post.id}">
                        ${(post.comments || []).map(c => `<div class="comment-item"><span class="cname">${c.user_name}</span> ${c.content}</div>`).join('')}
                    </div>
                </div>
            `;
            list.appendChild(div);
            loadCommentsForPost(post.id);
        });
        $('categoryHint').textContent = currentCategory;
    }

    async function loadCommentsForPost(postId) {
        try {
            const { data, error } = await supabase.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
            if (error) throw error;
            const container = document.getElementById(`cmt_list_${postId}`);
            if (!container) return;
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="font-size:12px;color:#8f8476;padding:4px 0;">暂无评论</div>';
                return;
            }
            container.innerHTML = data.map(c => `<div class="comment-item"><span class="cname">${c.user_name}</span> ${c.content}</div>`).join('');
        } catch (e) { console.error(e); }
    }

    window.handleComment = async function(postId) {
        if (!currentUser) { showToast('请先登录'); return; }
        const input = document.getElementById(`cmt_${postId}`);
        const text = input.value.trim();
        if (!text) return;
        try {
            await addComment(postId, currentUser.username, text);
            input.value = '';
            loadCommentsForPost(postId);
            showToast('✅ 评论成功');
        } catch (e) {
            showToast('❌ 评论失败: ' + e.message);
        }
    };

    // ---------- 登录/注册 UI ----------
    function renderHeader() {
        const right = $('headerRight');
        if (currentUser) {
            const initial = currentUser.username.charAt(0).toUpperCase();
            right.innerHTML = `
                <div class="user-badge">
                    <span class="name">${currentUser.username}</span>
                    <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            `;
            document.getElementById('logoutBtn')?.addEventListener('click', () => {
                currentUser = null;
                localStorage.removeItem('mc_user');
                renderHeader();
                updateUI();
                showToast('已退出');
            });
            // 隐藏登录横幅
            $('loginBanner').style.display = 'none';
        } else {
            right.innerHTML = '';
            // 显示登录横幅
            $('loginBanner').style.display = 'flex';
        }
        updateUI();
    }

    function updateUI() {
        const hint = $('publishHint');
        const btn = $('publishBtn');
        if (currentUser) {
            hint.textContent = '✅ 已登录，可发布';
            hint.style.color = '#4a7a5c';
            btn.disabled = false;
        } else {
            hint.textContent = '🔒 请先登录';
            hint.style.color = '#b33c3c';
            btn.disabled = true;
        }
    }

    // ---------- Modal ----------
    let isLoginMode = true;

    function openModal(loginMode = true) {
        isLoginMode = loginMode;
        $('authModal').style.display = 'flex';
        if (isLoginMode) {
            $('modalTitle').textContent = '🔑 欢迎回来';
            $('modalSubtitle').textContent = '登录你的账号，分享MC创作';
            $('authPrimaryBtn').textContent = '登录';
            $('authSecondaryBtn').textContent = '注册';
            $('switchText').textContent = '还没有账号？ 立即注册';
        } else {
            $('modalTitle').textContent = '📝 加入社区';
            $('modalSubtitle').textContent = '注册新账号，开始分享你的作品';
            $('authPrimaryBtn').textContent = '注册';
            $('authSecondaryBtn').textContent = '登录';
            $('switchText').textContent = '已有账号？ 去登录';
        }
        $('authUsername').value = '';
        $('authPassword').value = '';
    }

    function closeModal() { $('authModal').style.display = 'none'; }

    // ---------- 认证事件 ----------
    $('authPrimaryBtn').addEventListener('click', async function() {
        const username = $('authUsername').value.trim();
        const password = $('authPassword').value.trim();
        if (!username || !password) { showToast('请填写完整信息'); return; }
        if (username.length < 2) { showToast('名称至少2个字符'); return; }
        if (password.length < 3) { showToast('密码至少3个字符'); return; }

        const btn = this;
        btn.disabled = true;
        btn.textContent = '⏳ 处理中...';

        try {
            if (isLoginMode) {
                const user = await loginUser(username, password);
                currentUser = { username: user.username };
                localStorage.setItem('mc_user', JSON.stringify(currentUser));
                closeModal();
                renderHeader();
                showToast('✅ 登录成功，欢迎回来！');
            } else {
                await registerUser(username, password);
                currentUser = { username };
                localStorage.setItem('mc_user', JSON.stringify(currentUser));
                closeModal();
                renderHeader();
                showToast('🎉 注册成功！已自动登录');
            }
        } catch (e) {
            showToast('❌ ' + e.message, 3000);
        } finally {
            btn.disabled = false;
            btn.textContent = isLoginMode ? '登录' : '注册';
        }
    });

    $('authSecondaryBtn').addEventListener('click', () => { isLoginMode = !isLoginMode;
        openModal(isLoginMode); });
    $('switchAction').addEventListener('click', () => { isLoginMode = !isLoginMode;
        openModal(isLoginMode); });
    $('authModal').addEventListener('click', (e) => { if (e.target === $('authModal')) closeModal(); });
    $('authPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('authPrimaryBtn').click(); });
    $('authUsername').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('authPassword').focus(); });

    // ---------- 全局点击登录（横幅和右上角） ----------
    document.addEventListener('click', function(e) {
        if (e.target.closest('#loginOpenBtn')) {
            openModal(true);
        }
    });

    // ---------- 图片上传 ----------
    $('imageUploadBtn').addEventListener('click', () => {
        if (!currentUser) { showToast('请先登录'); return; }
        $('imageInput').click();
    });
    $('imageInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            if (file.size > 2 * 1024 * 1024) { showToast('图片太大，请选小于2MB的'); return; }
            const reader = new FileReader();
            reader.onload = (ev) => { $('imagePreview').src = ev.target.result;
                $('imagePreview').style.display = 'block'; };
            reader.readAsDataURL(file);
        }
    });

    // ---------- 文件上传 ----------
    $('fileUploadBtn').addEventListener('click', () => {
        if (!currentUser) { showToast('请先登录'); return; }
        $('fileInput').click();
    });
    $('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            if (file.size > 10 * 1024 * 1024) { showToast('文件太大，请选小于10MB的'); return; }
            $('fileNameDisplay').textContent = `${file.name} (${(file.size/1024).toFixed(1)} KB)`;
        }
    });

    // ---------- 发布 ----------
    $('publishBtn').addEventListener('click', async function() {
        if (!currentUser) { showToast('请先登录'); return; }
        const category = $('categorySelect').value;
        const version = $('versionSelect').value;
        const title = $('titleInput').value.trim();
        const desc = $('descInput').value.trim();
        const url = $('urlInput').value.trim();
        if (!title) { showToast('请填写标题'); return; }

        const image = $('imagePreview').style.display === 'block' ? $('imagePreview').src : null;
        let fileData = null,
            fileName = null;
        const file = $('fileInput').files[0];

        const loadingTip = $('loadingTip');
        const btn = this;
        loadingTip.style.display = 'inline';
        btn.disabled = true;

        const doPublish = async () => {
            try {
                await publishPost(category, version, title, desc, url, image, fileData, fileName);
                showToast('✅ 发布成功！');
                $('titleInput').value = '';
                $('descInput').value = '';
                $('urlInput').value = '';
                $('imagePreview').style.display = 'none';
                $('imagePreview').src = '';
                $('imageInput').value = '';
                $('fileInput').value = '';
                $('fileNameDisplay').textContent = '未选择文件';
                await loadPosts();
            } catch (e) {
                showToast('❌ 发布失败: ' + e.message, 4000);
            } finally {
                loadingTip.style.display = 'none';
                btn.disabled = false;
            }
        };

        if (file) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                fileData = ev.target.result;
                fileName = file.name;
                doPublish();
            };
            reader.onerror = function() { showToast('读取文件失败');
                loadingTip.style.display = 'none';
                btn.disabled = false; };
            reader.readAsDataURL(file);
            return;
        }
        await doPublish();
    });

    // ---------- 分类切换 ----------
    document.querySelectorAll('.pill').forEach(pill => {
        pill.addEventListener('click', function() {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.cat;
            renderPosts();
        });
    });

    // ---------- 启动 ----------
    async function init() {
        try {
            const saved = localStorage.getItem('mc_user');
            if (saved) currentUser = JSON.parse(saved);
        } catch (e) {}
        renderHeader();
        await loadPosts();
        console.log('✅ MC玩家社区 · Supabase 版已启动');
    }
    init();
</script>
</body>
</html>
